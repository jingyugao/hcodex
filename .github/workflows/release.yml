name: Release

# Fallback for building the package on GitHub; releases are normally built and published locally
# with scripts/release.sh, which this workflow runs too.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the package as a GitHub Release (tag hcodex-<short sha>)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # 4 cores and 16 GB on the hosted runner; release jobs need about 4 GB each.
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read the pinned codex commit
        id: codex
        run: echo "rev=$(tr -d '[:space:]' < codex.rev)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: jingyugao/codex
          ref: ${{ steps.codex.outputs.rev }}
          path: codex
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libasound2-dev

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-v1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            release-v1-${{ hashFiles('Cargo.lock') }}-

      - name: Build, package and smoke-test
        run: scripts/release.sh

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hcodex-linux-x64
          path: target/dist/
          if-no-files-found: error

      - name: Save build cache
        if: always() && !cancelled() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  publish:
    needs: package
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hcodex-linux-x64
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="hcodex-${GITHUB_SHA:0:7}"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "hcodex $tag (Linux x86_64, glibc)" \
            --notes "Built from $GITHUB_SHA; see build-info.json in the archive for the codex commit." \
            dist/hcodex-linux-x64.tar.gz dist/SHA256SUMS
