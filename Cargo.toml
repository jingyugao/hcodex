[workspace]
resolver = "2"
members = ["ha/pg", "ha/ext", "server"]
# The pinned codex checkout (see codex.rev) is a separate workspace that hcodex depends on.
exclude = ["codex"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# hcodex
hcodex-ha = { path = "ha/ext" }
hcodex-pg = { path = "ha/pg" }

# codex crates from the pinned checkout at ./codex (jingyugao/codex at codex.rev)
codex-app-server = { path = "codex/codex-rs/app-server" }
codex-app-server-protocol = { path = "codex/codex-rs/app-server-protocol" }
codex-arg0 = { path = "codex/codex-rs/arg0" }
codex-config = { path = "codex/codex-rs/config" }
codex-core = { path = "codex/codex-rs/core" }
codex-extension-api = { path = "codex/codex-rs/ext/extension-api" }
codex-protocol = { path = "codex/codex-rs/protocol" }
codex-queue-extension = { path = "codex/codex-rs/ext/queue" }
codex-rollout = { path = "codex/codex-rs/rollout" }
codex-thread-store = { path = "codex/codex-rs/thread-store" }
codex-utils-absolute-path = { path = "codex/codex-rs/utils/absolute-path" }
codex-utils-cargo-bin = { path = "codex/codex-rs/utils/cargo-bin" }
codex-utils-cli = { path = "codex/codex-rs/utils/cli" }
codex-utils-path-uri = { path = "codex/codex-rs/utils/path-uri" }
codex-websocket-auth = { path = "codex/codex-rs/websocket-auth" }
core_test_support = { path = "codex/codex-rs/core/tests/common" }

# Third-party crates, with the versions and features codex uses.
anyhow = "1"
chrono = "0.4.43"
clap = "4"
futures = { version = "0.3", default-features = false }
pretty_assertions = "1.4.1"
serde = { version = "1", features = ["rc"] }
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = [
    "chrono",
    "json",
    "migrate",
    "runtime-tokio",
    "tls-rustls",
    "sqlite-bundled",
    "time",
    "uuid",
] }
sqlx-macros = { version = "=0.9.0", default-features = false, features = ["derive", "migrate"] }
tempfile = "3.23.0"
tikv-jemallocator = "=0.7.0"
tokio = "1"
tokio-tungstenite = { version = "0.28.0", features = [
    "proxy",
    "rustls-tls-native-roots",
] }
tracing = "0.1.44"
uuid = "1"
wiremock = "0.6"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
debug = "line-tables-only"
split-debuginfo = "off"
strip = false

# BEGIN synced from codex by scripts/sync-codex.sh; do not edit by hand
[workspace.lints]
rust = {}

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

# cargo-shear cannot see the platform-specific openssl-sys usage, so we
# silence the false positive here instead of deleting a real dependency.

[patch.crates-io]
# Uncomment to debug local changes.
# ratatui = { path = "../../ratatui" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "02cb49fa827411e9279e3688d19ab9e82661b0e8" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "db4be399bc1b8b5de2edb46c7187834edabf7e30" }
v8 = { git = "https://github.com/openai-oss-forks/rusty_v8.git", rev = "90a65f887a0c0f048f3784afbcb320b373c8a2e0" }

# Uncomment to debug local changes.
# rmcp = { path = "../../rust-sdk/crates/rmcp" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "db4be399bc1b8b5de2edb46c7187834edabf7e30" }
# END synced from codex
