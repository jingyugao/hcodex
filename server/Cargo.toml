[package]
edition.workspace = true
license.workspace = true
name = "hcodex-server"
version.workspace = true

# Same name as upstream's binary, so deployments and the Code Mode host lookup (next to the
# executable) keep working.
[[bin]]
name = "codex-app-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-app-server = { workspace = true }
codex-arg0 = { workspace = true }
codex-config = { workspace = true }
codex-core = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-cli = { workspace = true }
codex-websocket-auth = { workspace = true }
hcodex-ha = { workspace = true }
hcodex-pg = { workspace = true }

[target.'cfg(all(target_os = "linux", target_env = "musl", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { workspace = true }
